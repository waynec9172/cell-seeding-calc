<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#bg)" stroke="#3b82f6" stroke-width="8"/>
  <rect x="96" y="96" width="320" height="320" rx="28" fill="#1e293b" stroke="#38bdf8" stroke-width="6"/>
  <!-- Grid Lines -->
  <line x1="202" y1="96" x2="202" y2="416" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="309" y1="96" x2="309" y2="416" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="96" y1="202" x2="416" y2="202" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <line x1="96" y1="309" x2="416" y2="309" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.6"/>
  <!-- Live Cells -->
  <circle cx="149" cy="149" r="22" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="256" cy="149" r="24" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="362" cy="149" r="21" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="149" cy="256" r="23" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="#22c55e" stroke="#ffffff" stroke-width="4" filter="url(#glow)"/>
  <!-- Trypan Blue Cell -->
  <circle cx="362" cy="256" r="21" fill="#2563eb" stroke="#93c5fd" stroke-width="3"/>
  <circle cx="362" cy="256" r="10" fill="#1e3a8a"/>
  <!-- Row 3 Cells -->
  <circle cx="149" cy="362" r="22" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="256" cy="362" r="24" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
  <circle cx="362" cy="362" r="23" fill="#22c55e" stroke="#f0fdf4" stroke-width="3" filter="url(#glow)"/>
</svg>